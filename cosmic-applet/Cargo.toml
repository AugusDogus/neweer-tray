[package]
name = "cosmic-applet-neewer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "COSMIC panel applet to toggle Neewer lights via the USB dongle"

[[bin]]
name = "neewer-gnome-tray"
path = "src/gnome_main.rs"

[[bin]]
name = "neewer-toggle"
path = "src/toggle_main.rs"

[dependencies]
hidapi = { version = "2.6.5", default-features = false, features = ["linux-shared-hidraw"] }
ksni = { version = "0.3.4", features = ["blocking"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = [
  "applet",
  "tokio",
  "wayland",
  "winit",
]
